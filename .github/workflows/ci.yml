name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    # Pinned to an exact tag, not the moving @v1 tag: @v1 has been retired
    # because it drifted patch releases behind while still accepting inputs
    # it did not implement, so a configured input could silently no-op.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.14.20

    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

    with:
      # v0.0.1/v0.0.2 were tagged by hand; auto-tagging on every merge to
      # main once CI lands would surprise consumers pinning an exact tag.
      disable-version-bumping: true
      go_version: '1.27.0'
      # Measured (go test ./... -coverprofile + go tool cover -func): 0.0%.
      # No _test.go files exist yet; floor set at the true, honestly-measured
      # value.
      min_test_coverage_percent: 0
